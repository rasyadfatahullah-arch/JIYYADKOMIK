<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIYYADKOMIK - by JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #16161f;
    --border: rgba(255,255,255,0.08);
    --accent: #ff2d55;
    --accent-hover: #ff476f;
    --text: #fff;
    --text-muted: #9a9aa5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(255,45,85,0.08), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(100,50,255,0.06), transparent 40%);
    background-attachment: fixed;
  }
  svg { fill: currentColor; }
  a { color: inherit; text-decoration: none; }
  img { -webkit-user-drag: none; user-select: none; }

  /* ============ NAV ============ */
  nav {
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 14px 5%;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, var(--accent), #ff8f00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }
  .brand svg { width: 26px; height: 26px; fill: var(--accent); flex-shrink: 0; }
  .owner {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .search-wrap {
    flex: 1;
    max-width: 500px;
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap > svg {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 18px 10px 42px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--text-muted); }

  /* ============ CONTAINER ============ */
  .container { padding: 30px 5%; max-width: 1400px; margin: 0 auto; }

  /* ============ LOADING / ERRORS ============ */
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .error-msg h3 { color: var(--accent); margin-bottom: 8px; font-size: 18px; }
  .error-msg p { font-size: 14px; }

  /* ============ SECTION ============ */
  .section-title {
    font-size: 22px; font-weight: 800;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ''; width: 4px; height: 22px;
    background: var(--accent); border-radius: 2px;
  }

  /* ============ GRID ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(255,45,85,0.2);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: #1a1a25;
    display: block;
  }
  .card-title {
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============ MANGA DETAIL ============ */
  .manga-detail {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }
  .manga-cover {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    background: #1a1a25;
  }
  .manga-info h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 14px;
    line-height: 1.2;
    word-wrap: break-word;
  }
  .manga-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .meta-tag {
    font-size: 12px;
    padding: 5px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text-muted);
  }
  .meta-tag strong { color: var(--accent); margin-right: 4px; }
  .synopsis {
    color: #ccc;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 14px;
    max-height: 180px;
    overflow: hidden;
    position: relative;
    transition: max-height 0.4s;
  }
  .synopsis.expanded { max-height: 2000px; }
  .synopsis::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(transparent, var(--bg));
    pointer-events: none;
  }
  .synopsis.expanded::after { display: none; }
  .toggle-synopsis {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .toggle-synopsis:hover { background: var(--card); }

  /* ============ CHAPTER LIST ============ */
  .chapter-section {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .chapter-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chapter-header span { color: var(--text-muted); font-size: 12px; font-weight: 500; }
  .chapter-list {
    max-height: 520px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  .chapter-list::-webkit-scrollbar { width: 6px; }
  .chapter-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  .chapter-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
    font-size: 14px;
    gap: 12px;
  }
  .chapter-item:hover { background: rgba(255,45,85,0.08); }
  .chapter-item:last-child { border-bottom: none; }
  .chapter-num { font-weight: 600; }
  .chapter-date { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }

  /* ============ READER ============ */
  .reader-header {
    position: sticky;
    top: 66px;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    padding: 10px 5%;
    border-bottom: 1px solid var(--border);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn-nav {
    background: var(--card);
    border: 1px solid var(--border);
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.2s;
  }
  .btn-nav:hover { border-color: var(--accent); }
  .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-nav svg { width: 16px; height: 16px; }
  .reader-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    flex: 1;
    min-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reader-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 0;
    background: #000;
  }
  .reader-container img {
    width: 100%;
    display: block;
    margin: 0;
    background: #0f0f14;
  }
  .reader-actions {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 5% 40px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
  }
  .btn-big {
    flex: 1;
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .btn-big:hover { background: var(--accent-hover); }
  .btn-big:disabled { background: var(--card); color: var(--text-muted); cursor: not-allowed; }
  .btn-big svg { width: 18px; height: 18px; }

  .top-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .top-back:hover { border-color: var(--accent); }
  .top-back svg { width: 16px; height: 16px; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 768px) {
    .manga-detail { grid-template-columns: 130px 1fr; gap: 14px; }
    .manga-info h1 { font-size: 17px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .container { padding: 20px 4%; }
    .brand { font-size: 17px; }
    .owner { display: none; }
    nav { padding: 12px 4%; gap: 10px; }
    .reader-header { top: 0; padding: 8px 4%; }
    .chapter-num { font-size: 13px; }
    .synopsis { font-size: 13px; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand" onclick="goHome()">
    <svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
    JIYYADKOMIK
  </div>
  <div class="owner">by JIYYAD TOOLS</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="searchInput" type="text" placeholder="Cari judul komik..." autocomplete="off">
  </div>
</nav>

<div class="container" id="app">
  <div class="spinner"></div>
</div>

<script>
/* =========================================
   CONFIG
========================================= */
const BASE = 'https://komiku.org';
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
];

/* =========================================
   STATE
========================================= */
let searchTimer;
let requestSeq = 0;
let cachedChapters = [];
let currentMangaUrl = '';

/* =========================================
   UTILS
========================================= */
async function fetchHTML(url) {
  let lastError;
  for (const buildProxy of PROXIES) {
    try {
      const res = await fetch(buildProxy(url), { signal: AbortSignal.timeout(20000) });
      if (!res.ok) { lastError = new Error(`HTTP ${res.status}`); continue; }
      const text = await res.text();
      if (text && text.length > 500 && text.includes('<')) return text;
      lastError = new Error('Invalid content');
    } catch (e) { lastError = e; }
  }
  throw lastError || new Error('Semua proxy gagal');
}

function parseDoc(html) {
  return new DOMParser().parseFromString(html, 'text/html');
}

function absURL(path, base = BASE) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  try { return new URL(path, base).href; }
  catch { return path; }
}

function imgFallback(img) {
  if (img.dataset.fallback) return;
  img.dataset.fallback = '1';
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><rect fill="#1a1a25" width="100" height="140"/><text x="50" y="72" text-anchor="middle" fill="#555" font-size="9" font-family="sans-serif">NO COVER</text></svg>`
  );
}

function setApp(html) {
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}

/* =========================================
   EXTRACTOR — komik cards
========================================= */
function extractComics(doc) {
  const map = new Map();
  doc.querySelectorAll('a[href*="/manga/"]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || href.includes('-chapter-')) return;
    const url = absURL(href);
    if (!url.includes('/manga/')) return;
    if (map.has(url)) return;

    const title = (a.getAttribute('title') || a.textContent || '').trim();
    if (!title || title.length < 2 || title.length > 200) return;

    // cari cover di a atau parent terdekat
    let img = a.querySelector('img');
    if (!img) {
      let p = a.parentElement, depth = 0;
      while (p && depth < 4 && !img) {
        img = p.querySelector('img');
        p = p.parentElement;
        depth++;
      }
    }
    const cover = img
      ? absURL(img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || '')
      : '';

    map.set(url, { title, url, cover });
  });
  return Array.from(map.values());
}

/* =========================================
   RENDER — grid
========================================= */
function renderGrid(comics) {
  if (!comics.length) {
    return `<div class="error-msg"><h3>Tidak ada komik ditemukan</h3><p>Coba kata kunci lain atau muat ulang.</p></div>`;
  }
  return `<div class="grid">${comics.map(c => `
    <div class="card" onclick="openManga('${c.url.replace(/'/g, "\\'")}')">
      <img class="card-img" src="${c.cover}" alt="${c.title.replace(/"/g, '&quot;')}" loading="lazy" onerror="imgFallback(this)">
      <div class="card-title">${c.title}</div>
    </div>
  `).join('')}</div>`;
}

/* =========================================
   VIEW — HOME
========================================= */
async function goHome(push = true) {
  if (push) history.pushState({ view: 'home' }, '', '#home');
  const myReq = ++requestSeq;
  setApp('<div class="spinner"></div>');

  try {
    const html = await fetchHTML(BASE + '/');
    if (myReq !== requestSeq) return;
    const doc = parseDoc(html);
    const comics = extractComics(doc).slice(0, 60);
    if (myReq !== requestSeq) return;
    setApp(`
      <h2 class="section-title">Komik Terbaru</h2>
      ${renderGrid(comics)}
    `);
  } catch (e) {
    if (myReq !== requestSeq) return;
    setApp(`<div class="error-msg"><h3>Gagal memuat beranda</h3><p>${e.message}</p></div>`);
  }
}

/* =========================================
   VIEW — SEARCH
========================================= */
async function doSearch(query, push = true) {
  if (push) history.pushState({ view: 'search', query }, '', '#search=' + encodeURIComponent(query));
  const myReq = ++requestSeq;
  setApp('<div class="spinner"></div>');

  try {
    const url = `${BASE}/?s=${encodeURIComponent(query)}&post_type=manga`;
    const html = await fetchHTML(url);
    if (myReq !== requestSeq) return;
    const doc = parseDoc(html);
    const comics = extractComics(doc);
    if (myReq !== requestSeq) return;
    setApp(`
      <h2 class="section-title">Hasil: "${query}"</h2>
      ${renderGrid(comics)}
    `);
  } catch (e) {
    if (myReq !== requestSeq) return;
    setApp(`<div class="error-msg"><h3>Pencarian gagal</h3><p>${e.message}</p></div>`);
  }
}

/* =========================================
   VIEW — MANGA DETAIL
========================================= */
async function openManga(url, push = true) {
  if (push) history.pushState({ view: 'manga', url }, '', '#manga=' + encodeURIComponent(url));
  const myReq = ++requestSeq;
  currentMangaUrl = url;
  setApp('<div class="spinner"></div>');

  try {
    const html = await fetchHTML(url);
    if (myReq !== requestSeq) return;
    const doc = parseDoc(html);

    const title =
      (doc.querySelector('#Judul h1')?.textContent ||
       doc.querySelector('h1')?.textContent || '').trim();

    const synopsis =
      (doc.querySelector('#Description')?.textContent ||
       doc.querySelector('.desc')?.textContent ||
       doc.querySelector('meta[property="og:description"]')?.getAttribute('content') || '').trim();

    const cover =
      doc.querySelector('meta[property="og:image"]')?.getAttribute('content') ||
      doc.querySelector('.ims img')?.getAttribute('src') || '';

    // metadata
    const meta = {};
    doc.querySelectorAll('.inftable tr').forEach(tr => {
      const tds = tr.querySelectorAll('td');
      if (tds.length >= 2) {
        const k = tds[0].textContent.trim();
        const v = tds[1].textContent.trim();
        if (k && v) meta[k] = v;
      }
    });

    // chapters
    const chapters = [];
    const seen = new Set();
    doc.querySelectorAll('a[href*="-chapter-"]').forEach(a => {
      const href = a.getAttribute('href');
      if (!href) return;
      const abs = absURL(href, url);
      if (seen.has(abs)) return;
      seen.add(abs);

      const text = (a.textContent || '').trim();
      if (!text) return;

      // ambil tanggal dari parent tr jika ada
      const tr = a.closest('tr');
      let date = '';
      if (tr) {
        const tds = tr.querySelectorAll('td');
        if (tds.length >= 2) date = tds[1].textContent.trim();
      }

      chapters.push({ title: text, url: abs, date });
    });

    // sort: nomor chapter descending (terbaru di atas)
    chapters.sort((a, b) => {
      const na = parseFloat(a.title.match(/(\d+(?:\.\d+)?)/)?.[1]) || 0;
      const nb = parseFloat(b.title.match(/(\d+(?:\.\d+)?)/)?.[1]) || 0;
      return nb - na;
    });

    cachedChapters = chapters;

    const metaHtml = Object.entries(meta)
      .filter(([k]) => !/^(sinopsis|description)$/i.test(k))
      .slice(0, 6)
      .map(([k, v]) => `<span class="meta-tag"><strong>${k}</strong>${v}</span>`)
      .join('');

    setApp(`
      <button class="top-back" onclick="goHome()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Beranda
      </button>

      <div class="manga-detail">
        <img class="manga-cover" src="${cover}" alt="${title}" onerror="imgFallback(this)">
        <div class="manga-info">
          <h1>${title}</h1>
          <div class="manga-meta">${metaHtml}</div>
          <div class="synopsis" id="synopsis">${synopsis || '<em>Sinopsis tidak tersedia.</em>'}</div>
          <button class="toggle-synopsis" onclick="document.getElementById('synopsis').classList.toggle('expanded')">
            Tampilkan Sinopsis
          </button>
        </div>
      </div>

      <div class="chapter-section">
        <div class="chapter-header">
          Daftar Chapter
          <span>${chapters.length} chapter</span>
        </div>
        <div class="chapter-list">
          ${chapters.map((c, i) => `
            <div class="chapter-item" onclick="openChapter(${i})">
              <span class="chapter-num">${c.title}</span>
              ${c.date ? `<span class="chapter-date">${c.date}</span>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `);
  } catch (e) {
    if (myReq !== requestSeq) return;
    setApp(`<div class="error-msg"><h3>Gagal memuat manga</h3><p>${e.message}</p></div>`);
  }
}

/* =========================================
   VIEW — READER
========================================= */
async function openChapter(index, push = true) {
  if (index < 0 || index >= cachedChapters.length) return;
  const chapter = cachedChapters[index];
  if (push) history.pushState({ view: 'reader', index }, '', '#read=' + index);
  const myReq = ++requestSeq;
  setApp('<div class="spinner"></div>');

  try {
    const html = await fetchHTML(chapter.url);
    if (myReq !== requestSeq) return;
    const doc = parseDoc(html);

    // cari kontainer gambar
    let imgs = [];
    const containers = [
      doc.querySelector('#Baca_Komik'),
      doc.querySelector('.chapter-img'),
      doc.querySelector('#readerarea'),
      doc.querySelector('main'),
    ].filter(Boolean);

    for (const c of containers) {
      const found = Array.from(c.querySelectorAll('img')).map(img => ({
        src: img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || '',
        w: parseInt(img.getAttribute('width') || '0')
      }));
      const clean = found
        .filter(x => x.src && x.w !== 1)
        .filter(x => !/promosi|logo|banner|ads|komiku\.org\/wp-/i.test(x.src))
        .map(x => absURL(x.src, chapter.url));
      if (clean.length > imgs.length) imgs = clean;
      if (imgs.length > 2) break;
    }

    if (!imgs.length) {
      setApp(`<div class="error-msg"><h3>Gambar tidak ditemukan</h3><p>Chapter ini mungkin kosong atau strukturnya berubah.</p></div>`);
      return;
    }

    const prevIdx = index + 1 < cachedChapters.length ? index + 1 : -1; // array desc, prev = lebih lama
    const nextIdx = index - 1 >= 0 ? index - 1 : -1; // next = lebih baru
    const prevChapter = prevIdx >= 0 ? cachedChapters[prevIdx] : null;
    const nextChapter = nextIdx >= 0 ? cachedChapters[nextIdx] : null;

    setApp(`
      <div class="reader-header">
        <button class="btn-nav" onclick="openManga('${currentMangaUrl.replace(/'/g, "\\'")}', false)">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Komik
        </button>
        <div class="reader-title">${chapter.title}</div>
        <button class="btn-nav" ${prevChapter ? '' : 'disabled'} onclick="${prevChapter ? `openChapter(${prevIdx})` : ''}">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="btn-nav" ${nextChapter ? '' : 'disabled'} onclick="${nextChapter ? `openChapter(${nextIdx})` : ''}">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <div class="reader-container" id="readerContainer">
        ${imgs.map((src, i) => `
          <img src="${src}" alt="page ${i+1}" loading="${i < 2 ? 'eager' : 'lazy'}"
               onerror="retryImg(this, '${src.replace(/'/g, "\\'")}')">
        `).join('')}
      </div>

      <div class="reader-actions">
        <button class="btn-big" ${prevChapter ? '' : 'disabled'} onclick="${prevChapter ? `openChapter(${prevIdx})` : ''}">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          Sebelumnya
        </button>
        <button class="btn-big" ${nextChapter ? '' : 'disabled'} onclick="${nextChapter ? `openChapter(${nextIdx})` : ''}">
          Berikutnya
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>
    `);
  } catch (e) {
    if (myReq !== requestSeq) return;
    setApp(`<div class="error-msg"><h3>Gagal memuat chapter</h3><p>${e.message}</p></div>`);
  }
}

/* Fallback: kalau gambar langsung gagal, coba lewat proxy */
function retryImg(img, originalSrc) {
  if (img.dataset.retried) { imgFallback(img); return; }
  img.dataset.retried = '1';
  img.src = `https://api.allorigins.win/raw?url=${encodeURIComponent(originalSrc)}`;
}

/* =========================================
   SEARCH INPUT
========================================= */
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) {
    if (history.state?.view !== 'home') goHome();
    return;
  }
  if (q.length > 1) {
    searchTimer = setTimeout(() => doSearch(q), 700);
  }
});

/* =========================================
   BROWSER BACK/FORWARD
========================================= */
window.addEventListener('popstate', e => {
  const s = e.state;
  if (!s || s.view === 'home') return goHome(false);
  if (s.view === 'search') { searchInput.value = s.query; return doSearch(s.query, false); }
  if (s.view === 'manga') return openManga(s.url, false);
  if (s.view === 'reader') return openChapter(s.index, false);
});

/* =========================================
   INIT
========================================= */
history.replaceState({ view: 'home' }, '', '#home');
goHome(false);
</script>
</body>
</html>
